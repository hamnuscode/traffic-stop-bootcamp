  The full mark is logo.png; logo-traffic-light.png is the earlier lockup.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Journey 2 Justice Learning">
  <rect width="64" height="64" rx="8" fill="#000000"/>
  <rect x="9" y="21" width="15" height="2.4" fill="#FFFFFF"/>
  <rect x="40" y="21" width="15" height="2.4" fill="#FFFFFF"/>
  <rect x="9" y="40.6" width="15" height="2.4" fill="#FFFFFF"/>
  <rect x="40" y="40.6" width="15" height="2.4" fill="#FFFFFF"/>
  <text x="32" y="41" text-anchor="middle" fill="#FFFFFF"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" letter-spacing="-0.5">2</text>
</svg>
