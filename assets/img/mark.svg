  <circle cx="32" cy="18" r="9.5" fill="#E4595A"/>
  <circle cx="32" cy="32" r="9.5" fill="#F2B95C"/>
  <circle cx="32" cy="46" r="9.5" fill="#8FD05A"/>
</svg>
